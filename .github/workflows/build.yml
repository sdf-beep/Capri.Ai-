name: Build Capri APK

'on':
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. Добавляем кэш для глобальной папки Buildozer (SDK/NDK/скачанные архивы)
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-v2-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      # 2. Устанавливаем нужные пакеты SDK напрямую
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      # 3. Создаём ссылку на sdkmanager для Buildozer
      - name: Setup sdkmanager for Buildozer
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$SDKMANAGER" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade buildozer cython==0.29.34 virtualenv

      - name: Pre-create SDK licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4b6a5b573652ffc7aaf3aee85a47" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131b33910" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/google-tv-preview-license

      # 4. Запускаем сборку с автоматическим повтором при сетевой ошибке
      - name: Build with Buildozer (with retry)
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          # Пытаемся собрать до 3 раз при ошибке сети
          for i in {1..3}; do
            echo "Attempt $i..."
            if echo y | buildozer -v android debug; then
              exit 0
            else
              echo "Attempt $i failed. Retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "All attempts failed."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capri-apk
          path: bin/*.apk
