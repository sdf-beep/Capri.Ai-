name: Build Capri APK

'on':
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      # --- ЖЕЛЕЗОБЕТОННЫЙ ФИКС ПУТИ ---
      - name: Hard fix sdkmanager path
        run: |
          # Создаем папку tools/bin с правами админа там, где ее ищет Buildozer
          sudo mkdir -p /usr/local/lib/android/sdk/tools/bin
          # Делаем ссылку на настоящий sdkmanager
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager
          # Даем права на выполнение
          sudo chmod +x /usr/local/lib/android/sdk/tools/bin/sdkmanager
          echo "Проверяем, что файл на месте:"
          ls -la /usr/local/lib/android/sdk/tools/bin/sdkmanager

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade buildozer cython==0.29.34 virtualenv

      - name: Build with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo y | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capri-apk
          path: bin/*.apk
