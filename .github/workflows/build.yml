name: Build Capri APK

'on':
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Using sdkmanager at: $SDKMANAGER"
          "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      # --- ИСПРАВЛЕНИЕ: Создаем симлинк по тому пути, который требует Buildozer ---
      - name: Setup sdkmanager for Buildozer
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          # Создаем папку tools/bin внутри глобального SDK (требует sudo)
          sudo mkdir -p "$ANDROID_HOME/tools/bin"
          sudo ln -sf "$SDKMANAGER" "$ANDROID_HOME/tools/bin/sdkmanager"
          
          echo "Symlink created:"
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade buildozer cython==0.29.34 virtualenv

      - name: Build with Buildozer (with retry)
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          
          max_attempts=3
          attempt=1
          until [ $attempt -gt $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if echo y | buildozer -v android debug; then
              echo "Build succeeded!"
              exit 0
            else
              echo "Attempt $attempt failed. Retrying in 15 seconds..."
              attempt=$((attempt+1))
              sleep 15
            fi
          done
          echo "All attempts failed."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: capri-apk
          path: bin/*.apk
